<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1180" viewBox="0 0 1340 1180"><rect width="1340" height="1180" fill="#F1E4E9"/><text x="40" y="50" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1E1519" text-anchor="start">The open call: at the floor, or with margin?</text><text x="40" y="78" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C5156" text-anchor="start">Every APCA target is a floor. Both palettes clear every one. They differ only in how much room they keep above it,</text><text x="40" y="97" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5C5156" text-anchor="start">and no measurement picks that — the solver has been choosing it for you by always taking the minimum legal value.</text><text x="40" y="120" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1519" text-anchor="start">Only DARK, ACCENT and SELECT move. LIGHT and CURSOR are pinned by hard constraints and are identical in both.</text><text x="50" y="160" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1519" text-anchor="start">A — at the floor</text><text x="50" y="180" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5C5156" text-anchor="start">what the solver picks today: the minimum legal value everywhere</text><rect x="40" y="190" width="620" height="370" fill="#1E1519"/><rect x="50" y="200" width="600" height="48" fill="#A86283"/><text x="66" y="231" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#F1E4E9" text-anchor="start">Remainder — a key window</text><rect x="50" y="248" width="600" height="302" fill="#F1E4E9"/><rect x="50" y="248" width="156" height="302" fill="#BBAEB3"/><text x="66" y="280" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1519" text-anchor="start">Overview</text><text x="66" y="311" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1519" text-anchor="start">Poles</text><rect x="50" y="322" width="156" height="29" fill="#803D5E"/><text x="66" y="342" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#F1E4E9" text-anchor="start">Palette</text><text x="66" y="373" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1519" text-anchor="start">Surfaces</text><text x="230" y="280" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E1519" text-anchor="start">Every chrome value clears every pole.</text><text x="230" y="306" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#1E1519" text-anchor="start">Panel and button text is bold, so it needs Lc 60.</text><text x="230" y="324" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#1E1519" text-anchor="start">Body text on the field needs Lc 90.</text><text x="230" y="360" font-family="Hack, DejaVu Sans Mono, monospace" font-size="13" fill="#1E1519" text-anchor="start">python3 build/poles.py</text><rect x="402" y="348" width="9" height="17" fill="#007891"/><rect x="230" y="384" width="100" height="34" fill="#A86283"/><text x="250" y="407" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#F1E4E9" text-anchor="start">Derive</text><rect x="344" y="384" width="100" height="34" fill="#BBAEB3"/><text x="364" y="407" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1519" text-anchor="start">Cancel</text><rect x="458" y="384" width="100" height="34" fill="#AF1E2D"/><text x="478" y="407" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="start">Delete</text><rect x="230" y="480" width="52" height="32" fill="#F1E4E9" stroke="#1E1519" stroke-width="1"/><text x="230" y="526" font-family="Hack, DejaVu Sans Mono, monospace" font-size="8" fill="#5C5156" text-anchor="start">#F1E4E9</text><rect x="290" y="480" width="52" height="32" fill="#BBAEB3" stroke="#1E1519" stroke-width="1"/><text x="290" y="526" font-family="Hack, DejaVu Sans Mono, monospace" font-size="8" fill="#5C5156" text-anchor="start">#BBAEB3</text><rect x="350" y="480" width="52" height="32" fill="#5C5156" stroke="#1E1519" stroke-width="1"/><text x="350" y="526" font-family="Hack, DejaVu Sans Mono, monospace" font-size="8" fill="#5C5156" text-anchor="start">#5C5156</text><rect x="410" y="480" width="52" height="32" fill="#1E1519" stroke="#1E1519" stroke-width="1"/><text x="410" y="526" font-family="Hack, DejaVu Sans Mono, monospace" font-size="8" fill="#5C5156" text-anchor="start">#1E1519</text><rect x="470" y="480" width="52" height="32" fill="#A86283" stroke="#1E1519" stroke-width="1"/><text x="470" y="526" font-family="Hack, DejaVu Sans Mono, monospace" font-size="8" fill="#5C5156" text-anchor="start">#A86283</text><rect x="530" y="480" width="52" height="32" fill="#803D5E" stroke="#1E1519" stroke-width="1"/><text x="530" y="526" font-family="Hack, DejaVu Sans Mono, monospace" font-size="8" fill="#5C5156" text-anchor="start">#803D5E</text><rect x="590" y="480" width="52" height="32" fill="#007891" stroke="#1E1519" stroke-width="1"/><text x="590" y="526" font-family="Hack, DejaVu Sans Mono, monospace" font-size="8" fill="#5C5156" text-anchor="start">#007891</text><text x="700" y="160" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1519" text-anchor="start">B — with margin</text><text x="700" y="180" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5C5156" text-anchor="start">DARK, ACCENT and SELECT keep room; ACCENT returns to the wine</text><rect x="690" y="190" width="620" height="370" fill="#1E1519"/><rect x="700" y="200" width="600" height="48" fill="#763555"/><text x="716" y="231" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#F1E4E9" text-anchor="start">Remainder — a key window</text><rect x="700" y="248" width="600" height="302" fill="#F1E4E9"/><rect x="700" y="248" width="156" height="302" fill="#BBAEB3"/><text x="716" y="280" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1519" text-anchor="start">Overview</text><text x="716" y="311" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1519" text-anchor="start">Poles</text><rect x="700" y="322" width="156" height="29" fill="#521436"/><text x="716" y="342" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#F1E4E9" text-anchor="start">Palette</text><text x="716" y="373" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1519" text-anchor="start">Surfaces</text><text x="880" y="280" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E1519" text-anchor="start">Every chrome value clears every pole.</text><text x="880" y="306" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#1E1519" text-anchor="start">Panel and button text is bold, so it needs Lc 60.</text><text x="880" y="324" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#1E1519" text-anchor="start">Body text on the field needs Lc 90.</text><text x="880" y="360" font-family="Hack, DejaVu Sans Mono, monospace" font-size="13" fill="#1E1519" text-anchor="start">python3 build/poles.py</text><rect x="1052" y="348" width="9" height="17" fill="#007891"/><rect x="880" y="384" width="100" height="34" fill="#763555"/><text x="900" y="407" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#F1E4E9" text-anchor="start">Derive</text><rect x="994" y="384" width="100" height="34" fill="#BBAEB3"/><text x="1014" y="407" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1519" text-anchor="start">Cancel</text><rect x="1108" y="384" width="100" height="34" fill="#AF1E2D"/><text x="1128" y="407" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="start">Delete</text><rect x="880" y="480" width="52" height="32" fill="#F1E4E9" stroke="#1E1519" stroke-width="1"/><text x="880" y="526" font-family="Hack, DejaVu Sans Mono, monospace" font-size="8" fill="#5C5156" text-anchor="start">#F1E4E9</text><rect x="940" y="480" width="52" height="32" fill="#BBAEB3" stroke="#1E1519" stroke-width="1"/><text x="940" y="526" font-family="Hack, DejaVu Sans Mono, monospace" font-size="8" fill="#5C5156" text-anchor="start">#BBAEB3</text><rect x="1000" y="480" width="52" height="32" fill="#31282C" stroke="#1E1519" stroke-width="1"/><text x="1000" y="526" font-family="Hack, DejaVu Sans Mono, monospace" font-size="8" fill="#5C5156" text-anchor="start">#31282C</text><rect x="1060" y="480" width="52" height="32" fill="#1E1519" stroke="#1E1519" stroke-width="1"/><text x="1060" y="526" font-family="Hack, DejaVu Sans Mono, monospace" font-size="8" fill="#5C5156" text-anchor="start">#1E1519</text><rect x="1120" y="480" width="52" height="32" fill="#763555" stroke="#1E1519" stroke-width="1"/><text x="1120" y="526" font-family="Hack, DejaVu Sans Mono, monospace" font-size="8" fill="#5C5156" text-anchor="start">#763555</text><rect x="1180" y="480" width="52" height="32" fill="#521436" stroke="#1E1519" stroke-width="1"/><text x="1180" y="526" font-family="Hack, DejaVu Sans Mono, monospace" font-size="8" fill="#5C5156" text-anchor="start">#521436</text><rect x="1240" y="480" width="52" height="32" fill="#007891" stroke="#1E1519" stroke-width="1"/><text x="1240" y="526" font-family="Hack, DejaVu Sans Mono, monospace" font-size="8" fill="#5C5156" text-anchor="start">#007891</text><text x="40" y="620" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E1519" text-anchor="start">Every pair under both. The bar runs 0–100 Lc; the upright notch is the floor it must clear.</text><text x="40" y="670" font-family="Hack, DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#1E1519" text-anchor="start">BLACK on WHITE</text><text x="40" y="685" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#5C5156" text-anchor="start">body text on the field</text><rect x="320" y="658" width="660" height="27" fill="#F1E4E9" stroke="#5C5156" stroke-width="0.8"/><rect x="321" y="659" width="596" height="12" fill="#A86283"/><rect x="321" y="672" width="596" height="12" fill="#763555"/><line x1="914" y1="654" x2="914" y2="689" stroke="#1E1519" stroke-width="2.5"/><text x="914" y="650" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" font-weight="bold" fill="#1E1519" text-anchor="middle">floor 90</text><text x="994" y="669" font-family="Hack, DejaVu Sans Mono, monospace" font-size="11" fill="#5C5156" text-anchor="start">A  90.6</text><text x="994" y="683" font-family="Hack, DejaVu Sans Mono, monospace" font-size="11" fill="#5C5156" text-anchor="start">B  90.6</text><text x="40" y="724" font-family="Hack, DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#1E1519" text-anchor="start">BLACK on LIGHT</text><text x="40" y="739" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#5C5156" text-anchor="start">panel + button text, bold  · pinned</text><rect x="320" y="712" width="660" height="27" fill="#F1E4E9" stroke="#5C5156" stroke-width="0.8"/><rect x="321" y="713" width="398" height="12" fill="#A86283"/><rect x="321" y="726" width="398" height="12" fill="#763555"/><line x1="716" y1="708" x2="716" y2="743" stroke="#1E1519" stroke-width="2.5"/><text x="716" y="704" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" font-weight="bold" fill="#1E1519" text-anchor="middle">floor 60</text><text x="994" y="723" font-family="Hack, DejaVu Sans Mono, monospace" font-size="11" fill="#5C5156" text-anchor="start">A  60.5</text><text x="994" y="737" font-family="Hack, DejaVu Sans Mono, monospace" font-size="11" fill="#5C5156" text-anchor="start">B  60.5</text><text x="1064" y="730" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#5C5156" text-anchor="start">identical</text><text x="40" y="778" font-family="Hack, DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#1E1519" text-anchor="start">WHITE on DARK</text><text x="40" y="793" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#5C5156" text-anchor="start">dock tile labels</text><rect x="320" y="766" width="660" height="27" fill="#F1E4E9" stroke="#5C5156" stroke-width="0.8"/><rect x="321" y="767" width="498" height="12" fill="#A86283"/><rect x="321" y="780" width="582" height="12" fill="#763555"/><line x1="815" y1="762" x2="815" y2="797" stroke="#1E1519" stroke-width="2.5"/><text x="815" y="758" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" font-weight="bold" fill="#1E1519" text-anchor="middle">floor 75</text><text x="994" y="777" font-family="Hack, DejaVu Sans Mono, monospace" font-size="11" fill="#5C5156" text-anchor="start">A  75.7</text><text x="994" y="791" font-family="Hack, DejaVu Sans Mono, monospace" font-size="11" fill="#5C5156" text-anchor="start">B  88.5</text><text x="40" y="832" font-family="Hack, DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#1E1519" text-anchor="start">WHITE on ACCENT</text><text x="40" y="847" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#5C5156" text-anchor="start">titlebar text, bold</text><rect x="320" y="820" width="660" height="27" fill="#F1E4E9" stroke="#5C5156" stroke-width="0.8"/><rect x="321" y="821" width="398" height="12" fill="#A86283"/><rect x="321" y="834" width="517" height="12" fill="#763555"/><line x1="716" y1="816" x2="716" y2="851" stroke="#1E1519" stroke-width="2.5"/><text x="716" y="812" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" font-weight="bold" fill="#1E1519" text-anchor="middle">floor 60</text><text x="994" y="831" font-family="Hack, DejaVu Sans Mono, monospace" font-size="11" fill="#5C5156" text-anchor="start">A  60.5</text><text x="994" y="845" font-family="Hack, DejaVu Sans Mono, monospace" font-size="11" fill="#5C5156" text-anchor="start">B  78.5</text><text x="40" y="886" font-family="Hack, DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#1E1519" text-anchor="start">WHITE on SELECT</text><text x="40" y="901" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#5C5156" text-anchor="start">selected row text</text><rect x="320" y="874" width="660" height="27" fill="#F1E4E9" stroke="#5C5156" stroke-width="0.8"/><rect x="321" y="875" width="497" height="12" fill="#A86283"/><rect x="321" y="888" width="576" height="12" fill="#763555"/><line x1="815" y1="870" x2="815" y2="905" stroke="#1E1519" stroke-width="2.5"/><text x="815" y="866" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" font-weight="bold" fill="#1E1519" text-anchor="middle">floor 75</text><text x="994" y="885" font-family="Hack, DejaVu Sans Mono, monospace" font-size="11" fill="#5C5156" text-anchor="start">A  75.5</text><text x="994" y="899" font-family="Hack, DejaVu Sans Mono, monospace" font-size="11" fill="#5C5156" text-anchor="start">B  87.5</text><text x="40" y="940" font-family="Hack, DejaVu Sans Mono, monospace" font-size="12" font-weight="bold" fill="#1E1519" text-anchor="start">CURSOR on WHITE</text><text x="40" y="955" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#5C5156" text-anchor="start">the cursor mark  · pinned</text><rect x="320" y="928" width="660" height="27" fill="#F1E4E9" stroke="#5C5156" stroke-width="0.8"/><rect x="321" y="929" width="400" height="12" fill="#A86283"/><rect x="321" y="942" width="400" height="12" fill="#763555"/><line x1="716" y1="924" x2="716" y2="959" stroke="#1E1519" stroke-width="2.5"/><text x="716" y="920" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" font-weight="bold" fill="#1E1519" text-anchor="middle">floor 60</text><text x="994" y="939" font-family="Hack, DejaVu Sans Mono, monospace" font-size="11" fill="#5C5156" text-anchor="start">A  60.7</text><text x="994" y="953" font-family="Hack, DejaVu Sans Mono, monospace" font-size="11" fill="#5C5156" text-anchor="start">B  60.7</text><text x="1064" y="946" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#5C5156" text-anchor="start">identical</text><text x="40" y="1000" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E1519" text-anchor="start">What you are choosing</text><text x="40" y="1024" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5C5156" text-anchor="start">A is the quietest the kit can be. Every surface sits exactly at the edge of legibility — maximally recessive chrome, which is</text><text x="40" y="1043" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5C5156" text-anchor="start">   the aesthetic §2 states. It is also the least robust: a dim screen, a bright room, or an older eye eats the whole margin.</text><text x="40" y="1062" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5C5156" text-anchor="start">B is more legible and more durable, at the cost of a chrome that asserts itself more. The titlebar returns to #763455.</text><text x="40" y="1081" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5C5156" text-anchor="start">Neither is more correct. Both clear every floor. This is the aesthetic call, and whichever you take gets labelled as one.</text></svg>