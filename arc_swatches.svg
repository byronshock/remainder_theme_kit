Nimbus Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#4B4045" text-anchor="start">chrome — hue-bearing, must clear every pole</text><text x="18" y="160" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#4B4045" text-anchor="start">neutrals — below C_FLOOR, a cast rather than a hue</text><text x="152" y="508" font-family="Hack, DejaVu Sans Mono, monospace" font-size="14" font-weight="bold" fill="#10080C" text-anchor="end">SELECT</text><text x="152" y="523" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" fill="#4B4045" text-anchor="end">L 0.31  C 0.100</text><text x="152" y="564" font-family="Hack, DejaVu Sans Mono, monospace" font-size="14" font-weight="bold" fill="#10080C" text-anchor="end">CURSOR</text><text x="152" y="579" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" fill="#4B4045" text-anchor="end">L 0.53  C 0.100</text><text x="30" y="620" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#4B4045" text-anchor="start">ACCENT and CURSOR read nearly the same in every column: same chroma, same ground, near-identical thresholds.</text><text x="30" y="638" font-family="Nimbus Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#4B4045" text-anchor="start">The neutral rows barely move across 55 degrees of hue — at chroma 0.020 the cast is almost hue-independent.</text></svg>