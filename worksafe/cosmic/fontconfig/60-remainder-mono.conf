<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Remainder, AUTHORITY.md §5: the mono renders at 500 and 700.

  Every surface declares the mono at 400 and 700, the weights the checkers measure their floors against,
  and CSS font matching resolves 400 to 500 when no 400 face exists, the way Montserrat's cuts work.
  A package that installs the whole family puts a 400 face on the machine, and 400 then resolves to it
  exactly. This takes the 400 cuts (Regular and Italic) of the mono and its fallback out of what every
  fontconfig client can see, for this user only.

  It also makes the mono what "monospace" means for this user: a program that asks for the generic family,
  and names no face of its own, gets the Nerd Font's Mono variant (the one flagged fixed-pitch, which is
  what a program asking for monospace expects), and Atkinson Hyperlegible Mono where that is absent. This
  file is read from the user's conf.d, which fontconfig includes before the system's own preference lists,
  so these come first. Chosen 2026-09-29.

  Installed by the fonts step of worksafe/cosmic/install.sh. Delete this file and run fc-cache to undo.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>AtkynsonMono Nerd Font</string></patelt>
        <patelt name="weight"><const>regular</const></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>AtkynsonMono Nerd Font Mono</string></patelt>
        <patelt name="weight"><const>regular</const></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>Atkinson Hyperlegible Mono</string></patelt>
        <patelt name="weight"><const>regular</const></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>AtkynsonMono Nerd Font Mono</family>
      <family>Atkinson Hyperlegible Mono</family>
    </prefer>
  </alias>
</fontconfig>
