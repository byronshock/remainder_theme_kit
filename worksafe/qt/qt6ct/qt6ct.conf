# Remainder for qt6ct -- the keys install.sh merges into ~/.config/qt6ct/qt6ct.conf. AUTHORITY.md is the authority.
# Implements section 2 (the palette, through the scheme this points at), section 5 (the type), section 0 (motion).
#
# This is a FRAGMENT, not the file: install.sh reads it, drops these comments (qt6ct's QSettings would drop
# them anyway) and sets each key below in the user's own qt6ct.conf, leaving every other key as it was --
# icon_theme, standard_dialogs, and cosmic_qt_version, which is COSMIC's own marker and the reason its daemon
# leaves a scheme path alone once it is not one of its own (PLATFORM.md, Qt). No colour is in this file:
# build/qt.py fails it if one appears.

[Appearance]
# Fusion is qt6ct's default when the key is absent, and it is set here because every value the checker derives
# is Fusion's (build/qt.py fusion()). Another style paints other derivations, unmeasured.
style=Fusion
# Without custom_palette=true the scheme path is read and ignored (qt6ctplatformtheme.cpp readSettings).
custom_palette=true
# install.sh writes the absolute path; qt6ct resolves ~ and $VAR too. Keep the basename: build/qt.py checks it.
color_scheme_path=~/.config/qt6ct/colors/remainder.conf

[Fonts]
# QFont::toString, the 10-field Qt 5 form: family, point size, pixel size (-1: from the point size), style hint,
# weight (50 is Normal on Qt 5's legacy scale, which Qt 6 converts to 400 -- the 10-field form is what both read), style, underline, strike-out, fixed
# pitch, raw mode. Section 5: UI Montserrat, mono Hack, 12 pt. The weight is Normal on purpose -- with the cuts
# install.sh --fonts installs (Medium and ExtraBold), fontconfig resolves Normal to Medium, the safe direction
# section 5 chooses; a machine with the whole family gets Regular, as Firefox does.
general="Montserrat,12,-1,5,50,0,0,0,0,0"
fixed="Hack,12,-1,5,50,0,0,0,0,0"

[Interface]
# Section 0: motion is the larger half. An empty list -- which QSettings spells @Invalid() -- is how qt6ct's own
# dialog records every effect unchecked: no animated or fading menus, combo boxes, tool tips or tool boxes.
gui_effects=@Invalid()
