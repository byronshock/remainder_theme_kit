<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect x="0" y="0" width="1000" height="640" fill="#4B4045"/><rect x="14" y="14" width="972" height="612" fill="#10080C"/><rect x="28" y="28" width="944" height="46" fill="#763555"/><text x="44" y="57" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#F1E4E9">Remainder — a palette chosen for what it is far from</text><rect x="28" y="74" width="944" height="538" fill="#F1E4E9"/><rect x="28" y="74" width="250" height="538" fill="#BAADB2"/><text x="48" y="108" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#10080C">Overview</text><text x="48" y="142" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#10080C">Poles</text><rect x="28" y="154" width="250" height="32" fill="#521436"/><text x="48" y="176" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#F1E4E9">Palette</text><text x="48" y="210" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#10080C">Surfaces</text><text x="48" y="244" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#10080C">Residue</text><text x="308" y="112" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#10080C">Every chrome value clears every pole.</text><text x="308" y="144" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#10080C">The hypothesis constrains hue only: at the home hue every</text><text x="308" y="168" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#10080C">chroma clears every signal by 31 degrees. Chroma and</text><text x="308" y="192" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#10080C">lightness are aesthetic choices, each labelled as one.</text><text x="308" y="242" font-family="Hack, DejaVu Sans Mono, monospace" font-size="15" fill="#10080C">python3 build/poles.py --bars</text><rect x="574" y="227" width="9" height="21" fill="#007891"/><rect x="308" y="276" width="112" height="38" fill="#763555"/><text x="334" y="301" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#F1E4E9">Derive</text><rect x="438" y="276" width="112" height="38" fill="#BAADB2"/><text x="464" y="301" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#10080C">Cancel</text><rect x="568" y="276" width="112" height="38" fill="#AF1E2D"/><text x="594" y="301" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Delete</text><text x="308" y="354" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#10080C">The only hues in the system that mean anything:</text><rect x="308" y="370" width="180" height="40" fill="#006B54"/><text x="320" y="396" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">SUCCESS</text><rect x="508" y="370" width="180" height="40" fill="#FCD116"/><text x="520" y="396" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">WARNING</text><rect x="708" y="370" width="180" height="40" fill="#AF1E2D"/><text x="720" y="396" font-family="Montserrat, Nimbus Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">DESTRUCTIVE</text><rect x="308" y="450" width="74" height="40" fill="#F1E4E9"/><rect x="308" y="450" width="74" height="40" fill="none" stroke="#10080C" stroke-width="1" opacity="0.45"/><text x="308" y="506" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" fill="#10080C">WHITE</text><text x="308" y="520" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" fill="#4B4045">#F1E4E9</text><rect x="392" y="450" width="74" height="40" fill="#BAADB2"/><rect x="392" y="450" width="74" height="40" fill="none" stroke="#10080C" stroke-width="1" opacity="0.45"/><text x="392" y="506" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" fill="#10080C">LIGHT</text><text x="392" y="520" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" fill="#4B4045">#BAADB2</text><rect x="476" y="450" width="74" height="40" fill="#4B4045"/><rect x="476" y="450" width="74" height="40" fill="none" stroke="#10080C" stroke-width="1" opacity="0.45"/><text x="476" y="506" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" fill="#10080C">DARK</text><text x="476" y="520" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" fill="#4B4045">#4B4045</text><rect x="560" y="450" width="74" height="40" fill="#10080C"/><rect x="560" y="450" width="74" height="40" fill="none" stroke="#10080C" stroke-width="1" opacity="0.45"/><text x="560" y="506" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" fill="#10080C">BLACK</text><text x="560" y="520" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" fill="#4B4045">#10080C</text><rect x="644" y="450" width="74" height="40" fill="#763555"/><rect x="644" y="450" width="74" height="40" fill="none" stroke="#10080C" stroke-width="1" opacity="0.45"/><text x="644" y="506" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" fill="#10080C">ACCENT</text><text x="644" y="520" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" fill="#4B4045">#763555</text><rect x="728" y="450" width="74" height="40" fill="#521436"/><rect x="728" y="450" width="74" height="40" fill="none" stroke="#10080C" stroke-width="1" opacity="0.45"/><text x="728" y="506" font-family="Hack, DejaVu Sans Mono, monospace" font-size="10" fill="#10080C">SELECT</text><text x="