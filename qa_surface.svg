19" font-weight="700" fill="#0F090C">Every chrome value clears every pole.</text><text x="440" y="164" font-family="Montserrat, sans-serif" font-size="15" font-weight="400" fill="#0F090C">The hypothesis constrains hue only: at the home hue every</text><text x="440" y="188" font-family="Montserrat, sans-serif" font-size="15" font-weight="400" fill="#0F090C">chroma clears every signal by 31 degrees. Chroma and</text><text x="440" y="212" font-family="Montserrat, sans-serif" font-size="15" font-weight="400" fill="#0F090C">lightness are aesthetic choices, each labelled as one.</text><text x="440" y="264" font-family="Hack, monospace" font-size="15" font-weight="400" fill="#0F090C">python3 build/poles.py --bars</text><rect x="440" y="296" width="112" height="38" fill="#773556"/><text x="466" y="321" font-family="Montserrat, sans-serif" font-size="15" font-weight="700" fill="#EFE5E9">Derive</text><rect x="570" y="296" width="112" height="38" fill="#B8AEB2"/><text x="596" y="321" font-family="Montserrat, sans-serif" font-size="15" font-weight="700" fill="#0F090C">Cancel</text><rect x="700" y="296" width="112" height="38" fill="#AF1E2D"/><text x="726" y="321" font-family="Montserrat, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Delete</text><text x="440" y="370" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="#0F090C">The only hues in the system that mean anything:</text><rect x="440" y="386" width="180" height="40" fill="#006B54"/><text x="452" y="412" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">SUCCESS</text><rect x="640" y="386" width="180" height="40" fill="#FCD116"/><text x="652" y="412" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="#000000">WARNING</text><rect x="840" y="386" width="180" height="40" fill="#AF1E2D"/><text x="852" y="412" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">DESTRUCTIVE</text><rect x="440" y="4