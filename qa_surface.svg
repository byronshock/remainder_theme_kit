ans-serif" font-size="15" font-weight="400" fill="#0F090C">The hypothesis constrains hue only: at the home hue every</text><text x="396" y="166" font-family="Montserrat, sans-serif" font-size="15" font-weight="400" fill="#0F090C">chroma clears every signal by 31 degrees. Chroma and</text><text x="396" y="190" font-family="Montserrat, sans-serif" font-size="15" font-weight="400" fill="#0F090C">lightness are aesthetic choices, each labelled as one.</text><text x="396" y="242" font-family="Hack, monospace" font-size="15" font-weight="400" fill="#0F090C">python3 build/poles.py --bars</text><rect x="396" y="274" width="112" height="38" fill="#773556"/><text x="422" y="299" font-family="Montserrat, sans-serif" font-size="15" font-weight="700" fill="#EFE5E9">Derive</text><rect x="526" y="274" width="112" height="38" fill="#B8AEB2"/><text x="552" y="299" font-family="Montserrat, sans-serif" font-size="15" font-weight="700" fill="#0F090C">Cancel</text><rect x="656" y="274" width="112" height="38" fill="#AF1E2D"/><text x="682" y="299" font-family="Montserrat, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Delete</text><text x="396" y="348" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="#0F090C">The only hues in the system that mean anything:</text><rect x="396" y="364" width="180" height="40" fill="#006B54"/><text x="408" y="390" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">SUCCESS</text><rect x="596" y="364" width="180" height="40" fill="#FCD116"/><text x="608" y="390" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="#000000">WARNING</text><rect x="796" y="364" width="180" height="40" fill="#AF1E2D"/><text x="808" y="390" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">DESTRUCTIVE</text><rect x="396" y="448" width="74" height="40" fill="#EFE5E9"/><rect x="396" y="448" width="74" height="40" fill="none" stroke="#0F090C" stroke-width