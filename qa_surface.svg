<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="772" viewBox="0 0 1120 772"><rect x="0" y="0" width="1120" height="772" fill="#10080C"/><rect x="44" y="44" width="78" height="78" fill="#4B4045"/><rect x="44" y="132" width="78" height="78" fill="#4B4045"/><rect x="44" y="220" width="78" height="78" fill="#4B4045"/><rect x="44" y="308" width="78" height="78" fill="#4B4045"/><text x="44" y="724" font-family="Montserrat, sans-serif" font-size="11" font-weight="400" fill="#F1E4E9">dock tiles DARK on the BLACK field — dE 23.7   ·   the key window's mark: CURSOR, 4 dp of the 44 dp rule (§5)</text><rect x="162" y="40" width="918" height="666" fill="#007891"/><rect x="166" y="44" width="910" height="48" fill="#763555"/><text x="184" y="75" font-family="Montserrat, sans-serif" font-size="17" font-weight="700" fill="#F1E4E9">Remainder — a palette chosen for what it is far from</text><rect x="166" y="92" width="910" height="610" fill="#F1E4E9"/><rect x="166" y="92" width="244" height="610" fill="#BAADB2"/><rect x="180" y="108" width="216" height="32" fill="#F1E4E9"/><text x="190" y="130" font-family="Montserrat, sans-serif" font-size="14" font-weight="400" fill="#10080C">poles</text><rect x="230" y="116" width="2" height="18" fill="#007891"/><text x="186" y="170" font-family="Montserrat, sans-serif" font-size="16" font-weight="700" fill="#10080C">Overview</text><text x="186" y="204" font-family="Montserrat, sans-serif" font-size="16" font-weight="700" fill="#10080C">Poles</text><rect x="166" y="216" width="244" height="32" fill="#521436"/><text x="186" y="238" font-family="Montserrat, sans-serif" font-size="16" font-weight="400" fill="#F1E4E9">Palette</text><text x="186" y="272" font-family="Montserrat, sans-serif" font-size="16" font-weight="700" fill="#10080C">Surfaces</text><text x="186" y="306" font-family="Montserrat, sans-serif" font-size="16" font-weight="700" fill="#10080C">Residue</text><text x="440" y="132" font-family="Montserrat, sans-serif" font-size="19" font-weight="700" fill="#10080C">Every chrome value clears every pole.</text><text x="440" y="164" font-family="Montserrat, sans-serif" font-size="15" font-weight="400" fill="#10080C">The hypothesis constrains hue only: at the home hue every</text><text x="440" y="188" font-family="Montserrat, sans-serif" font-size="15" font-weight="400" fill="#10080C">chroma clears every signal by 31 degrees. Chroma and</text><text x="440" y="212" font-family="Montserrat, sans-serif" font-size="15" font-weight="400" fill="#10080C">lightness are aesthetic choices, each labelled as one.</text><text x="440" y="264" font-family="Hack, monospace" font-size="15" font-weight="400" fill="#10080C">python3 build/poles.py --bars</text><rect x="440" y="296" width="112" height="38" fill="#763555"/><text x="466" y="321" font-family="Montserrat, sans-serif" font-size="15" font-weight="700" fill="#F1E4E9">Derive</text><rect x="570" y="296" width="112" height="38" fill="#BAADB2"/><text x="596" y="321" font-family="Montserrat, sans-serif" font-size="15" font-weight="700" fill="#10080C">Cancel</text><rect x="700" y="296" width="112" height="38" fill="#AF1E2D"/><text x="726" y="321" font-family="Montserrat, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Delete</text><text x="440" y="370" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="#10080C">The only hues in the system that mean anything:</text><rect x="440" y="386" width="180" height="40" fill="#006B54"/><text x="452" y="412" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">SUCCESS</text><rect x="640" y="386" width="180" height="40" fill="#FCD116"/><text x="652" y="412" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="#000000">WARNING</text><rect x="840" y="386" width="180" height="40" fill="#AF1E2D"/><text x="852" y="412" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">DESTRUCTIVE</text><rect x="440" y="4